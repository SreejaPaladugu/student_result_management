{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="login-card p-4 w-50 mx-auto">
    <div class="text-center" style="margin-top: 32px; margin-bottom: 40px;">
      <h4>Add New Student</h4>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label w-100 text-center">Student Name</label>
        <input type="text" name="name" class="form-control mb-3 mx-auto" style="max-width: 240px;" required>
      </div>
      <div class="mb-3">
        <label class="form-label w-100 text-center">Roll Number</label>
        <input type="text" name="roll" class="form-control mb-3 mx-auto" style="max-width: 180px;" required>
      </div>
      <div class="mb-3">
        <label class="form-label w-100 text-center">Marks</label>
        <input type="number" name="marks" class="form-control mb-3 mx-auto" style="max-width: 180px;" required>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-info px-4 py-1" style="min-width: 90px; font-size: 1rem;">Add</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
