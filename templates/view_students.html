{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('logout') }}" class="logout-link" style="position: fixed; top: 0; right: 0; z-index: 9999; font-size: 1rem; color: #dc3545; text-decoration: underline; padding: 0.5rem 1.2rem 0.5rem 1.5rem;">Logout</a>
<div class="container-fluid mt-4">
  <h3 class="mb-4">All Students</h3>
  <table class="table table-striped table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Roll</th>
        <th>Marks</th>
        <th>Grade</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s['id'] }}</td>
        <td>{{ s['name'] }}</td>
        <td>{{ s['roll'] }}</td>
        <td>{{ s['marks'] }}</td>
        <td>{{ s['grade'] }}</td>
        <td>
          <a class="btn btn-sm btn-warning" href="{{ url_for('edit_student', id=s['id']) }}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{{ url_for('delete_student', id=s['id']) }}"
             onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
