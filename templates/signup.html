{% extends 'base.html' %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center login-bg" style="height: 100vh;">
  <div class="login-card p-4" style="border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); border: 2px dashed #4e73df; background: #fff; max-width: 350px; width: 100%;">
    <div class="text-center mb-3" style="font-size: 2.5rem;">🎓</div>
    <h1 class="mb-4 text-center" style="font-size: 2rem; font-weight: bold; color: #4e73df;">Sign Up</h1>
    <form method="post">
      <input name="username" class="form-control mb-3 text-center" style="max-width: 220px; margin: 0 auto;" placeholder="Username">
      <input name="password" type="password" class="form-control mb-3 text-center" style="max-width: 220px; margin: 0 auto;" placeholder="Password">
      <button class="btn btn-success signup-btn mb-2" style="max-width: 220px; margin: 0 auto; display: block; height: 38px;">Sign Up</button>
    </form>
  </div>
</div>
{% endblock %}
